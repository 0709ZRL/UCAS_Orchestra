<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员管理 - 国科大民族管弦乐团管理平台</title>
<link rel="stylesheet" href="/css/shared.css">
<style>
/* ===== 数据大屏（深色主题） ===== */
.btn-dashboard{background:linear-gradient(135deg,#1890ff,#7c5cff);box-shadow:0 2px 6px rgba(24,144,255,.35)}
.btn-dashboard:hover{box-shadow:0 4px 14px rgba(24,144,255,.5)}
.dash-wrap{min-height:calc(100vh - 90px)}
.dash-header{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,#0f1e3d 0%,#132744 50%,#0b1a33 100%);border-radius:14px 14px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.dash-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:1px}
.dash-sub{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase}
.dash-back{margin-left:auto;padding:8px 18px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(255,255,255,.06);color:#dfe7f5;font-size:13px;cursor:pointer;transition:all .2s}
.dash-back:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);transform:translateY(-1px)}
.dash-hero{text-align:center;padding:34px 20px 30px;background:radial-gradient(1200px 300px at 50% -80px,rgba(24,144,255,.28),transparent),linear-gradient(180deg,#101f3d,#0a1830)}
.dash-hero-label{font-size:14px;color:rgba(255,255,255,.65);letter-spacing:4px}
.dash-hero-num{margin:10px 0 6px;font-size:64px;font-weight:800;color:#fff;line-height:1;text-shadow:0 0 30px rgba(24,144,255,.55)}
.dash-hero-num .dash-hero-unit{font-size:24px;font-weight:600;color:#00d4ff;margin-left:8px}
.dash-hero-sub{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:5px;text-transform:uppercase}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;background:#0a1830;border-radius:0 0 14px 14px}
.dash-card{background:linear-gradient(180deg,#132644,#0e1f3a);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.dash-card-wide{grid-column:1 / -1}
.dash-card-title{font-size:15px;font-weight:600;color:#e8f0ff;margin-bottom:14px;letter-spacing:1px}
.dash-card-title::before{content:'';display:inline-block;width:4px;height:14px;background:linear-gradient(180deg,#1890ff,#00d4ff);border-radius:2px;margin-right:8px;vertical-align:-2px}
.dash-donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.dash-donut-center-main{font-size:26px;font-weight:700;fill:#fff}
.dash-donut-center-sub{font-size:11px;fill:rgba(255,255,255,.5)}
.dash-legend-wrap{display:flex;flex-direction:column;gap:10px;min-width:120px}
.dash-legend{font-size:13px;color:#cfd9ec;display:flex;align-items:center;gap:8px}
.dash-legend b{color:#fff}
.dash-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dash-bar-val{font-size:11px;fill:rgba(255,255,255,.85);font-weight:600}
.dash-bar-label{font-size:10px;fill:rgba(255,255,255,.55)}
.dash-hbars{display:flex;flex-direction:column;gap:10px}
.dash-hbar-row{display:flex;align-items:center;gap:10px}
.dash-hbar-label{flex:0 0 88px;font-size:13px;color:#cfd9ec;text-align:right}
.dash-hbar-track{flex:1;background:rgba(255,255,255,.06);border-radius:6px;height:24px;overflow:hidden}
.dash-hbar-fill{height:100%;border-radius:6px;min-width:4px;transition:width .8s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.dash-hbar-num{font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.dash-hbar-pct{flex:0 0 42px;font-size:12px;color:rgba(255,255,255,.6);text-align:right}
.dash-empty{text-align:center;padding:40px;color:rgba(255,255,255,.4);font-size:13px}
@media (max-width:900px){
  .dash-grid{grid-template-columns:1fr}
  .dash-hero-num{font-size:52px}
}
</style>
</head>
<body>
<div id="app">
<div class="header">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1>🎵 国科大民族管弦乐团管理平台</h1>
  <span class="env">Orchestra v1.0</span>
  <div class="header-right">
    <div class="user-name" id="headerUser">
      <img id="avatarThumb" src="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:#eee;vertical-align:middle">
      <div class="dropdown">
        <div style="padding:12px 16px;border-bottom:1px solid #eee">
          <div id="dropName" style="font-weight:600;font-size:14px"></div>
          <div id="dropId" style="font-size:12px;color:#999;margin-top:2px"></div>
        </div>
        <a href="/my-registrations">📋 我的报名</a>
        <a href="/profile">👤 个人信息</a>
        <a onclick="logout()">🚪 退出登录</a>
      </div>
    </div>
  </div>
</div>
<div class="container">
  <nav class="sidebar">
    <a href="/home">🏠 首页</a>
    <a href="/persons" class="active">👤 成员管理</a>
    <a href="/events">📅 活动管理</a>
    <a href="/attendance">📋 出勤管理</a>
    <a href="/checkin">📍 活动打卡</a>
    <a href="/rooms">🎹 琴房预约</a>
    <a href="/scores">🎼 乐谱管理</a>
    <a href="/logistics">📦 后勤管理</a>
    <a href="/articles">📰 文章管理</a>
    <a href="/my-registrations">📋 我的报名</a>
    <a href="/profile">👤 个人信息</a>
  </nav>
  <div class="main" id="main-content">
    <div id="page-persons" class="page active"></div>
  </div>
</div>
</div>
<!-- 模态框 -->
<div id="modal" class="modal-overlay"><div class="modal" id="modalBody"></div></div>
<!-- Lightbox -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img class="lightbox-img" id="lightboxImg" src="" alt="大图预览">
</div>
<div id="toast"></div>
<script src="/js/shared/constants.js?v=2"></script>
<script src="/js/shared/utils.js?v=2"></script>
<script src="/js/shared/auth.js?v=2"></script>
<script src="/js/pages/persons.js?v=2"></script>
</body>
</html>
