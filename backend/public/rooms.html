<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琴房预约 - 乐团管理平台</title>
<link rel="stylesheet" href="/css/shared.css">
<style>
/* ===== 琴房预约页面 ===== */
.rooms-wrap { max-width: 1400px; margin: 0 auto; padding: 4px 0 20px; }

/* 顶部操作栏 */
.rooms-toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 14px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
.rooms-toolbar label { font-size: 13px; color: #666; }
.rooms-toolbar select { padding: 9px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; background: #fff; color: #333; outline: none; transition: border-color .2s; min-width: 150px; }
.rooms-toolbar select:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,.15); }
.btn-query { padding: 9px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: #52c41a; color: #fff; box-shadow: 0 2px 8px rgba(82,196,26,.3); transition: all .2s; }
.btn-query:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(82,196,26,.4); }
.btn-query:active { transform: scale(.96); }
.btn-query:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-reserve { padding: 9px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: #ff4d4f; color: #fff; box-shadow: 0 2px 8px rgba(255,77,79,.3); transition: all .2s; }
.btn-reserve:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255,77,79,.4); }
.btn-reserve:active { transform: scale(.96); }
.btn-reserve:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* 琴房使用须知 */
.room-notice { background: #fff7e6; border: 1px solid #ffe7ba; color: #ad6800; border-radius: 10px; padding: 10px 16px; font-size: 13px; line-height: 1.7; margin-bottom: 14px; }

/* 主体布局：左侧课表 75% + 右侧详情 25% */
.rooms-main { display: flex; gap: 14px; align-items: flex-start; }
.timetable-panel { flex: 0 0 75%; min-width: 0; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }

/* 周切换 */
.week-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
.week-nav .week-title { font-size: 15px; font-weight: 600; color: #333; }
.week-nav button { width: 34px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; background: #fff; font-size: 16px; cursor: pointer; color: #333; transition: all .2s; line-height: 1; }
.week-nav button:hover:not(:disabled) { border-color: #1890ff; color: #1890ff; background: #e6f7ff; }
.week-nav button:disabled { opacity: .35; cursor: not-allowed; }
.week-nav .week-btns { display: flex; gap: 8px; align-items: center; }
.week-nav .today-btn { width: auto; height: auto; padding: 7px 14px; border: 1px solid #d9d9d9; border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; color: #333; transition: all .2s; white-space: nowrap; flex-shrink: 0; line-height: normal; }
.week-nav .today-btn:hover { border-color: #1890ff; color: #1890ff; }

/* 课表滚动容器（固定表头/首列） */
.timetable-scroll { overflow: auto; max-height: calc(100vh - 230px); position: relative; }
table.timetable { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
table.timetable th, table.timetable td { border-bottom: 1px solid #f0f0f0; border-right: 1px solid #f0f0f0; }
table.timetable thead th { position: sticky; top: 0; z-index: 10; background: #fafafa; font-size: 13px; font-weight: 600; color: #555; padding: 10px 6px; text-align: center; }
table.timetable thead th .day-date { display: block; font-size: 11px; color: #999; font-weight: 400; margin-top: 2px; }
table.timetable thead th.today { background: #e6f7ff; color: #1890ff; }
table.timetable .time-col { position: sticky; left: 0; z-index: 5; background: #fafafa; font-size: 11px; color: #999; text-align: center; padding: 0 8px; width: 64px; }
table.timetable thead .time-col { z-index: 11; }
table.timetable .day-cell { position: relative; height: 45px; padding: 0; vertical-align: top; }
table.timetable .day-cell:hover { background: #fafbff; }
table.timetable .day-cell.is-today { background: #f0f9ff; }

/* 预约块 */
.resv-block { position: absolute; left: 0; border-radius: 6px; padding: 4px 6px; font-size: 11px; line-height: 1.4; overflow: hidden; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: box-shadow .15s, transform .1s; z-index: 2; }
.resv-block:hover { box-shadow: 0 3px 10px rgba(0,0,0,.22); transform: scale(1.01); }
.resv-block.active { outline: 2px solid #1890ff; outline-offset: 1px; box-shadow: 0 0 0 4px rgba(24,144,255,.25); z-index: 3; }
.resv-block .rb-time { font-weight: 600; white-space: nowrap; }
.resv-block .rb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resv-block.self { border-left: 3px solid rgba(0,0,0,.25); }

/* 空态 */
.timetable-empty { text-align: center; padding: 40px; color: #ccc; font-size: 14px; }

/* 右侧详情面板 */
.detail-panel { flex: 0 0 25%; min-width: 260px; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px; position: sticky; top: 10px; }
.detail-panel h3 { font-size: 15px; color: #333; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
.detail-empty { text-align: center; color: #bbb; font-size: 13px; padding: 40px 10px; line-height: 1.8; }
.detail-card .dc-row { display: flex; padding: 7px 0; font-size: 13px; line-height: 1.6; }
.detail-card .dc-row .dc-label { flex: 0 0 70px; color: #999; }
.detail-card .dc-row .dc-value { flex: 1; color: #333; word-break: break-all; }
.detail-card .dc-status { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
.dc-status.upcoming { background: #e6f7ff; color: #1890ff; }
.dc-status.ongoing { background: #fff7e6; color: #fa8c16; }
.dc-status.ended { background: #f5f5f5; color: #999; }
.detail-card .dc-part { margin-top: 8px; }
.detail-card .dc-part .tag { display: inline-block; background: #f0f2f5; border-radius: 4px; padding: 2px 8px; font-size: 12px; color: #555; margin: 3px 4px 0 0; }
.detail-card .dc-part .tag.self { background: #e6f7ff; color: #1890ff; }
.detail-actions { display: flex; gap: 10px; margin-top: 16px; }
.detail-actions button { flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-edit-resv { background: #1890ff; color: #fff; box-shadow: 0 2px 6px rgba(24,144,255,.3); }
.btn-edit-resv:hover { box-shadow: 0 4px 12px rgba(24,144,255,.4); }
.btn-cancel-resv { background: #ff4d4f; color: #fff; box-shadow: 0 2px 6px rgba(255,77,79,.3); }
.btn-cancel-resv:hover { box-shadow: 0 4px 12px rgba(255,77,79,.4); }
.detail-actions button:disabled { opacity: .4; cursor: not-allowed; }
.detail-actions button:active { transform: scale(.97); }

/* 预约模态框 */
.resv-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.resv-modal-head h3 { font-size: 17px; color: #1a1a2e; }
.resv-modal-close { width: 30px; height: 30px; border: none; background: #f0f2f5; border-radius: 50%; font-size: 16px; cursor: pointer; color: #666; transition: all .2s; }
.resv-modal-close:hover { background: #ff4d4f; color: #fff; }
.resv-form .form-group { margin-bottom: 14px; }
.resv-form .form-group > label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
.resv-form input[type="date"], .resv-form input[type="time"] { width: 100%; padding: 9px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s; }
.resv-form input:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,.15); }
.resv-form .time-row { display: flex; gap: 12px; }
.resv-form .time-row .form-group { flex: 1; }

/* 参与者标签输入 */
.participant-input-wrap { border: 1px solid #d9d9d9; border-radius: 8px; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; transition: border-color .2s; }
.participant-input-wrap:focus-within { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,.15); }
.p-tag { display: inline-flex; align-items: center; gap: 6px; background: #f0f2f5; border-radius: 6px; padding: 3px 8px; font-size: 13px; color: #333; }
.p-tag .p-tag-x { cursor: pointer; color: #999; font-size: 14px; line-height: 1; }
.p-tag .p-tag-x:hover { color: #ff4d4f; }
.p-tag.non-member { background: #fff1f0; color: #cf1322; }
.p-tag.self { background: #e6f7ff; color: #1890ff; }
.participant-input-wrap input { border: none; outline: none; flex: 1; min-width: 120px; font-size: 14px; padding: 4px; }
.p-search-results { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-top: 6px; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.p-search-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background .15s; font-size: 13px; }
.p-search-item:last-child { border-bottom: none; }
.p-search-item:hover { background: #e6f7ff; }
.p-search-item .psi-name { font-weight: 500; color: #333; }
.p-search-item .psi-id { font-size: 11px; color: #999; }
.p-search-item .psi-badge { font-size: 11px; padding: 1px 8px; border-radius: 8px; margin-left: auto; }
.p-search-item .psi-badge.member { background: #e6f7ff; color: #1890ff; }
.p-search-item .psi-badge.nonmember { background: #fff1f0; color: #cf1322; }
.p-error-msg { color: #ff4d4f; font-size: 12px; margin-top: 6px; }
.p-hint { color: #999; font-size: 12px; margin-top: 6px; }
.p-count { font-size: 12px; color: #999; margin-top: 6px; }

/* 非乐团成员须知弹窗 */
.notice-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.notice-box { background: #fff; border-radius: 12px; max-width: 440px; width: 100%; padding: 24px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.notice-box h4 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }
.notice-box .notice-text { background: #fff7e6; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #ad6800; line-height: 1.7; margin-bottom: 14px; }
.notice-box .notice-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; margin-bottom: 18px; cursor: pointer; }
.notice-box .notice-check input { width: 16px; height: 16px; accent-color: #1890ff; }
.notice-actions { display: flex; gap: 10px; justify-content: flex-end; }
.notice-actions button { padding: 8px 20px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; font-weight: 600; transition: all .2s; }
.notice-actions .btn-cancel { background: #f0f2f5; color: #555; }
.notice-actions .btn-confirm { background: #1890ff; color: #fff; }
.notice-actions .btn-confirm:disabled { opacity: .4; cursor: not-allowed; }

/* 表单按钮 */
.resv-form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.resv-form-actions button { padding: 9px 26px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
.resv-form-actions .btn-ok { background: #1890ff; color: #fff; box-shadow: 0 2px 8px rgba(24,144,255,.3); }
.resv-form-actions .btn-ok:hover { box-shadow: 0 4px 14px rgba(24,144,255,.4); }
.resv-form-actions .btn-ok:disabled { opacity: .5; cursor: not-allowed; }
.resv-form-actions .btn-cancel { background: #f0f2f5; color: #555; }

/* 加载中 */
.loading-wrap { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }
.loading-wrap .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid #e6e6e6; border-top-color: #1890ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.retry-btn { margin-top: 12px; padding: 8px 20px; border: 1px solid #1890ff; border-radius: 8px; background: #fff; color: #1890ff; font-size: 13px; cursor: pointer; transition: all .2s; }
.retry-btn:hover { background: #e6f7ff; }

/* 错误覆盖层 */
.rooms-error { text-align: center; padding: 40px; color: #999; }

/* 响应式 */
@media (max-width: 1024px) {
  .rooms-main { flex-direction: column; align-items: stretch; }
  .timetable-panel { flex: 1 1 auto; width: 100%; max-width: 100%; }
  .detail-panel { flex: 1 1 100%; width: 100%; position: static; }
  /* 窄屏课表保持最小宽度，支持横向滚动 */
  .timetable-scroll { max-height: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.timetable { min-width: 920px; }
  .week-nav { flex-wrap: wrap; gap: 8px; }
  .week-nav .week-title { min-width: 0; }
}
@media (max-width: 640px) {
  .rooms-toolbar { flex-direction: column; align-items: stretch; }
  .rooms-toolbar select, .rooms-toolbar .btn-query, .rooms-toolbar .btn-reserve { width: 100%; }
  .week-nav { justify-content: center; }
  .week-nav .week-title { flex-basis: 100%; text-align: center; }
}
</style>
</head>
<body>
<div id="app">
<div class="header">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1>🎵 乐团管理平台</h1>
  <span class="env">Orchestra v1.0</span>
  <div class="header-right">
    <div class="user-name" id="headerUser">
      <img id="avatarThumb" src="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;background:#eee;vertical-align:middle">
      <div class="dropdown">
        <div style="padding:12px 16px;border-bottom:1px solid #eee">
          <div id="dropName" style="font-weight:600;font-size:14px"></div>
          <div id="dropId" style="font-size:12px;color:#999;margin-top:2px"></div>
        </div>
        <a href="/my-registrations">📋 我的报名</a>
        <a href="/profile">👤 个人信息</a>
        <a onclick="logout()">🚪 退出登录</a>
      </div>
    </div>
  </div>
</div>
<div class="container">
  <nav class="sidebar">
    <a href="/home">🏠 首页</a>
    <a href="/persons">👤 成员管理</a>
    <a href="/events">📅 活动管理</a>
    <a href="/attendance">📋 出勤管理</a>
    <a href="/checkin">📍 活动打卡</a>
    <a href="/rooms" class="active">🎹 琴房预约</a>
    <a href="/scores">🎼 乐谱管理</a>
    <a href="/logistics">📦 后勤管理</a>
    <a href="/articles">📰 文章管理</a>
    <a href="/my-registrations">📋 我的报名</a>
    <a href="/profile">👤 个人信息</a>
  </nav>
  <div class="main" id="main-content">
    <div id="page-rooms" class="page active"></div>
  </div>
</div>
</div>
<!-- 模态框 -->
<div id="modal" class="modal-overlay"><div class="modal" id="modalBody" style="width:600px"></div></div>
<div id="toast"></div>
<script src="/js/shared/constants.js?v=8"></script>
<script src="/js/shared/utils.js?v=8"></script>
<script src="/js/shared/auth.js?v=8"></script>
<script src="/js/pages/rooms.js?v=8"></script>
</body>
</html>
